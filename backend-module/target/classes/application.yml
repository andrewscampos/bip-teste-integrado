server:
  port: 8080
  tomcat:
    threads:
      max: 200
    max-connections: 10000
    connection-timeout: 20000

spring: 
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/meubanco
    username: postgres
    password: senha123
    
    hikari:
      pool-name: HikariPool-Omni
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 12000
      max-lifetime: 1800000
      auto-commit: false
 
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    schemas: public
    locations: classpath:db/migration
  jackson:
    time-zone: America/Bahia
    date-format: yyyy-MM-dd'T'HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
    parser:
      allow-unquoted-control-chars: false
      
      